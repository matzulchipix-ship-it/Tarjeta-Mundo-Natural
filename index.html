    <script>
        function downloadVCard() {
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:Mundo Natural\nORG:Mundo Natural - Wellness Center desde 1970\nTEL;TYPE=WORK,VOICE:+502 7831-0379\nTEL;TYPE=WORK,VOICE:+502 7831-1902\nTEL;TYPE=CELL,VOICE:+502 4312-7594\nEMAIL:spamundonatural@gmail.com\nURL:https://www.mundonaturalgt.com\nADR;TYPE=WORK:;;Calle Real de Jocotenango No. 30;Antigua Guatemala;;;Guatemala\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'mundo_natural.vcf');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function shareCard() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Mundo Natural',
                        text: 'Wellness Center desde 1970. Visita nuestra tarjeta digital:',
                        url: window.location.href,
                    });
                } catch (err) {
                    console.log('Error sharing:', err);
                }
            } else {
                alert('Para compartir, copia el enlace de esta página en tu navegador.');
            }
        }
